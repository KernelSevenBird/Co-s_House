<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout/admin-layout}"
      lang="ko">
<head>
    <title>공통코드 관리</title>
</head>

<th:block layout:fragment="extra-css">
    <link rel="stylesheet" th:href="@{/css/admin/admin-common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common-code.css}">
</th:block>

<body>
    <!-- Content Header -->
    <div layout:fragment="content-header" class="content-header">
        <h2 class="content-header-title">공통코드 관리</h2>
        <div>
            <span class="text-muted">코드 그룹과 하위 코드를 관리할 수 있습니다.</span>
        </div>
    </div>

    <!-- Main Content -->
    <div layout:fragment="content">
        <div class="common-code-container">
            <!-- 좌측 사이드바 - 코드 그룹 트리 -->
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <input type="text" 
                           id="groupSearch" 
                           class="sidebar-search" 
                           placeholder="그룹명 검색...">
                </div>
                <div class="sidebar-body">
                    <ul id="groupTree" class="tree-list">
                        <li class="empty-state" id="groupEmptyState">
                            <div class="empty-icon">📁</div>
                            <div>코드 그룹을 불러오는 중...</div>
                        </li>
                    </ul>
                </div>
            </div>
            
            <!-- 우측 메인 영역 - 코드 리스트 -->
            <div class="main-section">
                <div class="main-header">
                    <h3 class="main-title" id="selectedGroupTitle">코드 그룹을 선택해주세요</h3>
                    <div class="main-actions">
                        <button class="btn btn-success" id="addGroupBtn">
                            <span>➕</span> 그룹 등록
                        </button>
                        <button class="btn btn-primary" id="addCodeBtn">
                            <span>➕</span> 코드 등록
                        </button>
                    </div>
                </div>
                <div class="main-body">
                    <div id="codeTableContainer">
                        <div class="empty-state">
                            <div class="empty-icon">🗂️</div>
                            <div>좌측에서 코드 그룹을 선택해주세요</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 공통코드 등록 모달 (탭 구조) -->
        <div id="commonCodeModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="modalTitle">공통코드 등록</h4>
                    <button class="modal-close" id="modalClose">&times;</button>
                </div>

                <!-- 탭 헤더 -->
                <div class="modal-tabs">
                    <div class="tab-header">
                        <button class="tab-button active" data-tab="group" id="groupTab">
                            <span>➕</span> 그룹 등록
                        </button>
                        <button class="tab-button" data-tab="code" id="codeTab">
                            <span>➕</span> 코드 등록
                        </button>
                    </div>
                </div>

                <div class="modal-body">
                    <!-- 그룹 등록 탭 -->
                    <div id="groupTabContent" class="tab-content active">
                        <form id="groupForm">
                            <div class="form-group">
                                <label class="form-label" for="groupId">
                                    그룹 ID <span class="required">*</span>
                                    <span class="char-count" id="groupIdCount">0/50</span>
                                </label>
                                <input type="text" id="groupId" name="groupId" class="form-input"
                                       maxlength="50" required
                                       placeholder="예: USER_STATUS">
                                <small class="form-hint">영문 대문자와 언더스코어(_)를 사용하세요</small>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="groupName">
                                    그룹명 <span class="required">*</span>
                                    <span class="char-count" id="groupNameCount">0/100</span>
                                </label>
                                <input type="text" id="groupName" name="groupName" class="form-input"
                                       maxlength="100" required
                                       placeholder="예: 사용자 상태">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="groupDescription">
                                    설명
                                    <span class="char-count" id="groupDescCount">0/255</span>
                                </label>
                                <textarea id="groupDescription" name="description" class="form-textarea"
                                          maxlength="255"
                                          placeholder="그룹에 대한 설명을 입력하세요"></textarea>
                            </div>

                            <div class="form-group">
                                <div class="form-checkbox">
                                    <input type="checkbox" id="groupIsActive" name="isActive" checked>
                                    <label class="form-label" for="groupIsActive">사용여부</label>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- 코드 등록 탭 -->
                    <div id="codeTabContent" class="tab-content">
                        <form id="codeForm">
                            <input type="hidden" id="codeIdHidden" name="codeId">
                            <input type="hidden" id="groupIdHidden" name="groupId">

                            <div class="form-group">
                                <label class="form-label" for="codeGroupSelect">코드 그룹 <span class="required">*</span></label>
                                <select id="codeGroupSelect" name="groupId" class="form-input" required>
                                    <option value="">그룹을 선택하세요</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="codeId">
                                    코드 ID <span class="required">*</span>
                                    <span class="char-count" id="codeIdCount">0/50</span>
                                </label>
                                <input type="text" id="codeId" name="codeId" class="form-input"
                                       maxlength="50" required
                                       placeholder="예: ACTIVE">
                                <small class="form-hint">영문 대문자와 언더스코어(_)를 사용하세요</small>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="codeName">
                                    코드명 <span class="required">*</span>
                                    <span class="char-count" id="codeNameCount">0/100</span>
                                </label>
                                <input type="text" id="codeName" name="codeName" class="form-input"
                                       maxlength="100" required
                                       placeholder="예: 활성">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="codeDescription">
                                    설명
                                    <span class="char-count" id="codeDescCount">0/255</span>
                                </label>
                                <textarea id="codeDescription" name="description" class="form-textarea"
                                          maxlength="255"
                                          placeholder="코드에 대한 설명을 입력하세요"></textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="sortOrder">정렬순서</label>
                                <input type="number" id="sortOrder" name="sortOrder" class="form-input"
                                       value="0" min="0"
                                       placeholder="0">
                                <small class="form-hint">숫자가 작을수록 먼저 표시됩니다</small>
                            </div>

                            <div class="form-group">
                                <div class="form-checkbox">
                                    <input type="checkbox" id="codeIsActive" name="isActive" checked>
                                    <label class="form-label" for="codeIsActive">사용여부</label>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" id="modalCancel">취소</button>
                    <button class="btn btn-primary" id="modalSave">
                        <span class="loading" id="saveLoading"></span>
                        <span id="saveButtonText">저장</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <th:block layout:fragment="extra-scripts">
        <script>
            class CommonCodeManager {
                constructor() {
                    this.selectedGroupId = null;
                    this.selectedGroupName = null;
                    this.currentEditingCode = null;
                    this.allGroups = [];
                    this.currentTab = 'group'; // 현재 활성 탭
                    this.editMode = false; // 수정 모드 여부

                    this.init();
                }

                init() {
                    this.bindEvents();
                    this.loadCodeGroups();
                    this.setupFormValidation();
                }
                
                bindEvents() {
                    // 검색
                    document.getElementById('groupSearch').addEventListener('input', (e) => {
                        this.filterGroups(e.target.value);
                    });

                    // 그룹 등록 버튼
                    document.getElementById('addGroupBtn').addEventListener('click', () => {
                        this.openModal('group');
                    });

                    // 코드 등록 버튼
                    document.getElementById('addCodeBtn').addEventListener('click', () => {
                        // 그룹이 선택되지 않은 경우
                        if (!this.selectedGroupId && this.allGroups.length === 0) {
                            alert('먼저 코드 그룹을 등록해주세요.');
                            this.openModal('group');
                            return;
                        }
                        this.openModal('code');
                    });

                    // 탭 버튼들
                    document.getElementById('groupTab').addEventListener('click', () => {
                        this.switchTab('group');
                    });

                    document.getElementById('codeTab').addEventListener('click', () => {
                        this.switchTab('code');
                    });

                    // 모달 관련
                    document.getElementById('modalClose').addEventListener('click', () => {
                        this.closeModal();
                    });

                    document.getElementById('modalCancel').addEventListener('click', () => {
                        this.closeModal();
                    });

                    document.getElementById('modalSave').addEventListener('click', () => {
                        this.save();
                    });

                    // 모달 외부 클릭시 닫기
                    document.getElementById('commonCodeModal').addEventListener('click', (e) => {
                        if (e.target.id === 'commonCodeModal') {
                            this.closeModal();
                        }
                    });
                }
                
                async loadCodeGroups() {
                    try {
                        const response = await fetch('/api/admin/common-code/groups');
                        if (!response.ok) {
                            throw new Error('코드 그룹 로드 실패');
                        }
                        this.allGroups = await response.json();
                        this.renderGroupTree(this.allGroups);
                    } catch (error) {
                        console.error('코드 그룹 로드 실패:', error);
                        this.showError('코드 그룹을 불러올 수 없습니다.');
                    }
                }
                
                renderGroupTree(groups) {
                    const treeContainer = document.getElementById('groupTree');
                    
                    if (!groups || groups.length === 0) {
                        treeContainer.innerHTML = `
                            <li class="empty-state">
                                <div class="empty-icon">📁</div>
                                <div>등록된 코드 그룹이 없습니다.</div>
                            </li>
                        `;
                        return;
                    }
                    
                    const treeHTML = groups.map(group => `
                        <li class="tree-item">
                            <div class="tree-link" data-group-id="${group.groupId}" data-group-name="${group.groupName}">
                                <span class="tree-icon">📂</span>
                                <div class="tree-item-content">
                                    <div class="tree-item-title">${group.groupName}</div>
                                    <div class="tree-item-subtitle">${group.groupId}</div>
                                </div>
                                <div class="group-actions">
                                    <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); commonCodeManager.editGroup('${group.groupId}')">수정</button>
                                    <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); commonCodeManager.deleteGroup('${group.groupId}')">삭제</button>
                                </div>
                            </div>
                        </li>
                    `).join('');
                    
                    treeContainer.innerHTML = treeHTML;
                    
                    // 그룹 클릭 이벤트 추가
                    treeContainer.querySelectorAll('.tree-link').forEach(link => {
                        link.addEventListener('click', (e) => {
                            const groupId = e.currentTarget.getAttribute('data-group-id');
                            const groupName = e.currentTarget.getAttribute('data-group-name');
                            this.selectGroup(groupId, groupName, e.currentTarget);
                        });
                    });
                }
                
                filterGroups(searchTerm) {
                    if (!searchTerm.trim()) {
                        this.renderGroupTree(this.allGroups);
                        return;
                    }
                    
                    const filteredGroups = this.allGroups.filter(group => 
                        group.groupName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        group.groupId.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                    
                    this.renderGroupTree(filteredGroups);
                }
                
                async selectGroup(groupId, groupName, element) {
                    // 기존 선택 해제
                    document.querySelectorAll('.tree-link.active').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    // 새로운 선택 활성화
                    element.classList.add('active');
                    
                    this.selectedGroupId = groupId;
                    this.selectedGroupName = groupName;
                    
                    // 헤더 업데이트
                    document.getElementById('selectedGroupTitle').textContent = `${groupName} 코드 목록`;
                    
                    // 코드 목록 로드
                    await this.loadCodes(groupId);
                }
                
                async loadCodes(groupId) {
                    const container = document.getElementById('codeTableContainer');
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="loading"></div>
                            <div>코드 목록을 불러오는 중...</div>
                        </div>
                    `;
                    
                    try {
                        const response = await fetch(`/api/admin/common-code/common-codes/${groupId}/child`);
                        
                        if (!response.ok) {
                            throw new Error('코드 목록 로드 실패');
                        }
                        
                        const codes = await response.json();
                        this.renderCodeTable(codes);
                        
                    } catch (error) {
                        console.error('코드 목록 로드 실패:', error);
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">❌</div>
                                <div>코드 목록을 불러올 수 없습니다.</div>
                            </div>
                        `;
                    }
                }
                
                renderCodeTable(codes) {
                    const container = document.getElementById('codeTableContainer');
                    
                    if (!codes || codes.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">🗂️</div>
                                <div>등록된 코드가 없습니다.</div>
                                <button class="btn btn-primary first-code-btn" onclick="commonCodeManager.openModal('code')">
                                    첫 번째 코드 등록하기
                                </button>
                            </div>
                        `;
                        return;
                    }
                    
                    const tableHTML = `
                        <table class="code-table">
                            <thead>
                                <tr>
                                    <th>코드 ID</th>
                                    <th>코드명</th>
                                    <th>설명</th>
                                    <th>사용여부</th>
                                    <th>정렬순서</th>
                                    <th>작업</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${codes.map(code => `
                                    <tr>
                                        <td><code>${code.codeId}</code></td>
                                        <td>${code.codeName}</td>
                                        <td>${code.description || '-'}</td>
                                        <td>
                                            <span class="${code.isActive ? 'status-active' : 'status-inactive'}">
                                                ${code.isActive ? '사용' : '미사용'}
                                            </span>
                                        </td>
                                        <td>${code.sortOrder}</td>
                                        <td>
                                            <div class="btn-group">
                                                <button class="btn btn-sm btn-secondary" onclick="commonCodeManager.editCode('${code.codeId}')">
                                                    수정
                                                </button>
                                                <button class="btn btn-sm btn-danger" onclick="commonCodeManager.deleteCode('${code.codeId}')">
                                                    삭제
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;1
                    
                    container.innerHTML = tableHTML;
                }
                
                setupFormValidation() {
                    // 문자수 카운터 설정
                    this.setupCharCounter('groupId', 'groupIdCount', 50);
                    this.setupCharCounter('groupName', 'groupNameCount', 100);
                    this.setupCharCounter('groupDescription', 'groupDescCount', 255);
                    this.setupCharCounter('codeId', 'codeIdCount', 50);
                    this.setupCharCounter('codeName', 'codeNameCount', 100);
                    this.setupCharCounter('codeDescription', 'codeDescCount', 255);
                }

                setupCharCounter(inputId, counterId, maxLength) {
                    const input = document.getElementById(inputId);
                    const counter = document.getElementById(counterId);

                    if (input && counter) {
                        input.addEventListener('input', () => {
                            const currentLength = input.value.length;
                            counter.textContent = `${currentLength}/${maxLength}`;

                            if (currentLength > maxLength * 0.8) {
                                counter.classList.add('warning');
                            } else {
                                counter.classList.remove('warning');
                            }
                        });
                    }
                }

                switchTab(tabName) {
                    // 탭 버튼 스타일 변경
                    document.querySelectorAll('.tab-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    document.getElementById(tabName + 'Tab').classList.add('active');

                    // 탭 컨텐츠 변경
                    document.querySelectorAll('.tab-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    document.getElementById(tabName + 'TabContent').classList.add('active');

                    this.currentTab = tabName;
                    this.updateSaveButtonText();
                }

                openModal(tab = 'group', editData = null) {
                    const modal = document.getElementById('commonCodeModal');

                    // 폼 초기화
                    this.resetForms();

                    // 탭 전환
                    this.switchTab(tab);

                    // 수정 모드인지 확인
                    this.editMode = !!editData;

                    if (tab === 'code') {
                        // 코드 등록/수정
                        this.loadGroupOptions();
                        if (this.selectedGroupId) {
                            document.getElementById('codeGroupSelect').value = this.selectedGroupId;
                        }

                        if (editData) {
                            // 수정 모드 - 폼에 기존 데이터 설정
                            this.populateCodeForm(editData);
                        }
                    } else if (editData) {
                        // 그룹 수정 모드
                        this.populateGroupForm(editData);
                    }

                    this.updateModalTitle();
                    this.updateSaveButtonText();
                    modal.classList.add('show');
                }

                populateGroupForm(groupData) {
                    document.getElementById('groupId').value = groupData.groupId || '';
                    document.getElementById('groupName').value = groupData.groupName || '';
                    document.getElementById('groupDescription').value = groupData.description || '';
                    document.getElementById('groupIsActive').checked = groupData.isActive !== false;

                    // 수정 모드에서는 그룹 ID 변경 불가
                    document.getElementById('groupId').disabled = true;
                }

                populateCodeForm(codeData) {
                    document.getElementById('codeGroupSelect').value = codeData.groupId || this.selectedGroupId;
                    document.getElementById('codeId').value = codeData.codeId || '';
                    document.getElementById('codeName').value = codeData.codeName || '';
                    document.getElementById('codeDescription').value = codeData.description || '';
                    document.getElementById('sortOrder').value = codeData.sortOrder || 0;
                    document.getElementById('codeIsActive').checked = codeData.isActive !== false;

                    // 수정 모드에서는 코드 ID 변경 불가
                    document.getElementById('codeId').disabled = true;
                }

                loadGroupOptions() {
                    const select = document.getElementById('codeGroupSelect');
                    select.innerHTML = '<option value="">그룹을 선택하세요</option>';

                    this.allGroups.forEach(group => {
                        const option = document.createElement('option');
                        option.value = group.groupId;
                        option.textContent = `${group.groupName} (${group.groupId})`;
                        select.appendChild(option);
                    });
                }

                updateModalTitle() {
                    const title = document.getElementById('modalTitle');
                    if (this.currentTab === 'group') {
                        title.textContent = this.editMode ? '그룹 수정' : '그룹 등록';
                    } else {
                        title.textContent = this.editMode ? '코드 수정' : '코드 등록';
                    }
                }

                updateSaveButtonText() {
                    const saveButtonText = document.getElementById('saveButtonText');
                    if (this.currentTab === 'group') {
                        saveButtonText.textContent = this.editMode ? '그룹 수정' : '그룹 저장';
                    } else {
                        saveButtonText.textContent = this.editMode ? '코드 수정' : '코드 저장';
                    }
                }

                resetForms() {
                    document.getElementById('groupForm').reset();
                    document.getElementById('codeForm').reset();

                    // 기본값 설정
                    document.getElementById('groupIsActive').checked = true;
                    document.getElementById('codeIsActive').checked = true;
                    document.getElementById('sortOrder').value = '0';

                    // 입력 필드 활성화
                    document.getElementById('groupId').disabled = false;
                    document.getElementById('codeId').disabled = false;

                    // 에러 스타일 제거
                    document.querySelectorAll('.form-input, .form-textarea').forEach(input => {
                        input.classList.remove('invalid');
                    });

                    // 에러 메시지 제거
                    document.querySelectorAll('.error-message').forEach(msg => {
                        msg.remove();
                    });

                    // 문자수 카운터 초기화
                    this.resetCharCounters();
                }

                resetCharCounters() {
                    const counters = [
                        {id: 'groupIdCount', max: 50},
                        {id: 'groupNameCount', max: 100},
                        {id: 'groupDescCount', max: 255},
                        {id: 'codeIdCount', max: 50},
                        {id: 'codeNameCount', max: 100},
                        {id: 'codeDescCount', max: 255}
                    ];

                    counters.forEach(counter => {
                        const element = document.getElementById(counter.id);
                        if (element) {
                            element.textContent = `0/${counter.max}`;
                            element.classList.remove('warning');
                        }
                    });
                }

                closeModal() {
                    const modal = document.getElementById('commonCodeModal');
                    modal.classList.remove('show');
                    this.currentEditingCode = null;
                    this.editMode = false;
                }

                async save() {
                    if (this.currentTab === 'group') {
                        await this.saveGroup();
                    } else {
                        await this.saveCode();
                    }
                }

                async saveGroup() {
                    const saveBtn = document.getElementById('modalSave');
                    const loading = document.getElementById('saveLoading');

                    // 유효성 검증
                    if (!this.validateGroupForm()) {
                        return;
                    }

                    const groupData = {
                        groupId: document.getElementById('groupId').value.trim(),
                        groupName: document.getElementById('groupName').value.trim(),
                        description: document.getElementById('groupDescription').value.trim(),
                        isActive: document.getElementById('groupIsActive').checked
                    };

                    // 저장 중 UI
                    saveBtn.disabled = true;
                    loading.classList.remove('hidden');
                    loading.classList.add('visible');

                    try {
                        const url = this.editMode ? '/api/admin/common-code/groups/update' : '/api/admin/common-code/groups';
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: new URLSearchParams(groupData)
                        });

                        const result = await response.json();

                        if (response.ok && result.success) {
                            // 성공 시
                            this.closeModal();
                            await this.loadCodeGroups(); // 그룹 목록 갱신
                            this.showSuccess(result.message);

                        } else {
                            // 서버 유효성 검증 오류 처리
                            if (result.errors) {
                                this.displayServerErrors(result.errors);
                            }
                            this.showError(result.message || '그룹 저장에 실패했습니다.');
                        }

                    } catch (error) {
                        console.error('그룹 저장 실패:', error);
                        this.showError('그룹 저장 중 오류가 발생했습니다: ' + error.message);
                    } finally {
                        saveBtn.disabled = false;
                        loading.style.display = 'none';
                    }
                }

                async saveCode() {
                    const saveBtn = document.getElementById('modalSave');
                    const loading = document.getElementById('saveLoading');

                    // 유효성 검증
                    if (!this.validateCodeForm()) {
                        return;
                    }

                    const codeData = {
                        codeId: document.getElementById('codeId').value.trim(),
                        groupId: document.getElementById('codeGroupSelect').value,
                        codeName: document.getElementById('codeName').value.trim(),
                        description: document.getElementById('codeDescription').value.trim(),
                        sortOrder: parseInt(document.getElementById('sortOrder').value) || 0,
                        isActive: document.getElementById('codeIsActive').checked
                    };

                    // 저장 중 UI
                    saveBtn.disabled = true;
                    loading.style.display = 'inline-block';

                    try {
                        const url = this.editMode ? '/api/admin/common-code/codes/update' : '/api/admin/common-code/codes';
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: new URLSearchParams(codeData)
                        });

                        const result = await response.json();

                        if (response.ok && result.success) {
                            // 성공 시
                            this.closeModal();
                            if (this.selectedGroupId) {
                                await this.loadCodes(this.selectedGroupId); // 코드 목록 갱신
                            }
                            this.showSuccess(result.message);
                        } else {
                            // 서버 유효성 검증 오류 처리
                            if (result.errors) {
                                this.displayServerErrors(result.errors);
                            }
                            this.showError(result.message || '코드 저장에 실패했습니다.');
                        }

                    } catch (error) {
                        console.error('코드 저장 실패:', error);
                        this.showError('코드 저장 중 오류가 발생했습니다: ' + error.message);
                    } finally {
                        saveBtn.disabled = false;
                        loading.style.display = 'none';
                    }
                }

                validateGroupForm() {
                    let isValid = true;
                    const groupId = document.getElementById('groupId').value.trim();
                    const groupName = document.getElementById('groupName').value.trim();

                    // 기존 에러 메시지 제거
                    document.querySelectorAll('.error-message').forEach(msg => msg.remove());
                    document.querySelectorAll('.form-input').forEach(input => input.classList.remove('invalid'));

                    // 그룹 ID 검증
                    if (!groupId) {
                        this.showFieldError('groupId', '그룹 ID는 필수입니다.');
                        isValid = false;
                    } else if (!/^[A-Z_]+$/.test(groupId)) {
                        this.showFieldError('groupId', '영문 대문자와 언더스코어(_)만 사용할 수 있습니다.');
                        isValid = false;
                    }

                    // 그룹명 검증
                    if (!groupName) {
                        this.showFieldError('groupName', '그룹명은 필수입니다.');
                        isValid = false;
                    }

                    return isValid;
                }

                validateCodeForm() {
                    let isValid = true;
                    const codeId = document.getElementById('codeId').value.trim();
                    const codeName = document.getElementById('codeName').value.trim();
                    const groupId = document.getElementById('codeGroupSelect').value;

                    // 기존 에러 메시지 제거
                    document.querySelectorAll('.error-message').forEach(msg => msg.remove());
                    document.querySelectorAll('.form-input').forEach(input => input.classList.remove('invalid'));

                    // 그룹 선택 검증
                    if (!groupId) {
                        this.showFieldError('codeGroupSelect', '코드 그룹을 선택해주세요.');
                        isValid = false;
                    }

                    // 코드 ID 검증
                    if (!codeId) {
                        this.showFieldError('codeId', '코드 ID는 필수입니다.');
                        isValid = false;
                    } else if (!/^[A-Z_]+$/.test(codeId)) {
                        this.showFieldError('codeId', '영문 대문자와 언더스코어(_)만 사용할 수 있습니다.');
                        isValid = false;
                    }

                    // 코드명 검증
                    if (!codeName) {
                        this.showFieldError('codeName', '코드명은 필수입니다.');
                        isValid = false;
                    }

                    return isValid;
                }

                showFieldError(fieldId, message) {
                    const field = document.getElementById(fieldId);
                    field.classList.add('invalid');

                    const errorDiv = document.createElement('span');
                    errorDiv.className = 'error-message';
                    errorDiv.textContent = message;

                    field.parentNode.appendChild(errorDiv);
                }
                
                async editCode(codeId) {
                    try {
                        const response = await fetch(`/api/admin/common-code/codes/${codeId}`);
                        if (!response.ok) {
                            throw new Error('코드 데이터 로드 실패');
                        }
                        const codeData = await response.json();
                        this.openModal('code', codeData);
                    } catch (error) {
                        console.error('코드 수정 데이터 로드 실패:', error);
                        this.showError('코드 데이터를 불러올 수 없습니다.');
                    }
                }

                async editGroup(groupId) {
                    try {
                        const response = await fetch(`/api/admin/common-code/groups/${groupId}`);
                        if (!response.ok) {
                            throw new Error('그룹 데이터 로드 실패');
                        }
                        const groupData = await response.json();
                        this.openModal('group', groupData);
                    } catch (error) {
                        console.error('그룹 수정 데이터 로드 실패:', error);
                        this.showError('그룹 데이터를 불러올 수 없습니다.');
                    }
                }
                
                showSuccess(message) {
                    // 간단한 성공 메시지 (추후 토스트로 대체 가능)
                    const alert = document.createElement('div');
                    alert.className = 'success-alert';
                    alert.textContent = message;
                    document.body.appendChild(alert);

                    setTimeout(() => {
                        document.body.removeChild(alert);
                    }, 3000);
                }
                
                showError(message) {
                    console.error(message);
                    alert(message);
                }

                displayServerErrors(errors) {
                    // 기존 에러 메시지 제거
                    document.querySelectorAll('.error-message').forEach(msg => msg.remove());
                    document.querySelectorAll('.form-input, .form-textarea').forEach(input => input.classList.remove('invalid'));

                    // 서버에서 받은 에러 메시지 표시
                    Object.keys(errors).forEach(fieldName => {
                        const field = document.getElementById(fieldName);
                        if (field) {
                            this.showFieldError(fieldName, errors[fieldName]);
                        }
                    });
                }

                async deleteCode(codeId) {
                    if (!confirm('정말 이 코드를 삭제하시겠습니까?')) {
                        return;
                    }

                    try {
                        const response = await fetch(`/api/admin/common-code/code/${codeId}/delete`);
                        const result = await response.json();

                        if (response.ok && result.success === 'true') {
                            this.showSuccess(result.message);
                            if (this.selectedGroupId) {
                                await this.loadCodes(this.selectedGroupId); // 코드 목록 갱신
                            }
                        } else {
                            this.showError(result.message || '코드 삭제에 실패했습니다.');
                        }
                    } catch (error) {
                        console.error('코드 삭제 실패:', error);
                        this.showError('코드 삭제 중 오류가 발생했습니다.');
                    }
                }

                async deleteGroup(groupId) {
                    if (!confirm('정말 이 그룹을 삭제하시겠습니까?\n그룹에 속한 모든 코드도 함께 삭제됩니다.')) {
                        return;
                    }

                    try {
                        const response = await fetch(`/api/admin/common-code/group/${groupId}/delete`);
                        const result = await response.json();

                        if (response.ok && result.success === 'true') {
                            this.showSuccess(result.message);
                            await this.loadCodeGroups(); // 그룹 목록 갱신

                            // 삭제된 그룹이 현재 선택된 그룹이면 초기화
                            if (this.selectedGroupId === groupId) {
                                this.selectedGroupId = null;
                                this.selectedGroupName = null;
                                document.getElementById('selectedGroupTitle').textContent = '코드 그룹을 선택해주세요';
                                document.getElementById('codeTableContainer').innerHTML = `
                                    <div class="empty-state">
                                        <div class="empty-icon">🗂️</div>
                                        <div>좌측에서 코드 그룹을 선택해주세요</div>
                                    </div>
                                `;
                            }
                        } else {
                            this.showError(result.message || '그룹 삭제에 실패했습니다.');
                        }
                    } catch (error) {
                        console.error('그룹 삭제 실패:', error);
                        this.showError('그룹 삭제 중 오류가 발생했습니다.');
                    }
                }
            }
            
            // 초기화
            let commonCodeManager;
            document.addEventListener('DOMContentLoaded', () => {
                commonCodeManager = new CommonCodeManager();
            });
        </script>
    </th:block>
</body>
</html>
