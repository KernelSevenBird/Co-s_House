<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시물 작성/수정</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1 th:text="${post.postId} ? '게시물 수정' : '게시물 작성'">게시물 작성</h1>
    <form th:action="${post.postId} ? @{/post/update} : @{/post/save}" th:object="${post}" method="post">
        <input type="hidden" th:field="*{postId}" th:if="*{postId}"><!--컨트롤러에게 어떤 글을 수정하는건지 보냄-->
        <div class="form-group">
            <label for="categoryId">카테고리</label>
            <select id="categoryId" th:field="*{categoryName}" required><!--컨트롤러에 카 어떤 테고리로 수정할건지 보냄-->
                <option value="">카테고리 선택</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">카테고리</option>
            </select>
        </div>
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>
        <div class="form-group">
            <label for="author">작성자</label>
            <input type="text" id="author" th:field="*{author}" required>
        </div>
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" th:field="*{content}" required></textarea>
        </div>
        <div class="button-group">
            <button type="submit" class="btn btn-save">저장</button>
            <a th:href="@{/post/}" class="btn btn-back">취소</a>
        </div>
    </form>
</div>
</body>
</html>
